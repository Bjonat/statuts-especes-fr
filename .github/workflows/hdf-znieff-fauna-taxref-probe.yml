name: HDF ZNIEFF fauna TAXREF v18 probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hdf-znieff-fauna-taxref-probe.yml'
      - 'data-pipeline/regions/hdf/**'
  workflow_dispatch:

jobs:
  reconcile-taxref:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TAXREF v18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/taxref"
          curl --fail --location --retry 3 https://assets.patrinat.fr/files/referentiel/TAXREF_v18_2025.zip -o "$RUNNER_TEMP/taxref.zip" \
            || curl --fail --location --retry 3 https://geonature.fr/data/inpn/taxonomie/TAXREF_v18_2025.zip -o "$RUNNER_TEMP/taxref.zip"
          unzip -q "$RUNNER_TEMP/taxref.zip" -d "$RUNNER_TEMP/taxref"
          TAXREF_FILE="$(find "$RUNNER_TEMP/taxref" -type f -iname 'TAXREFv18.txt' | head -n 1)"
          test -n "$TAXREF_FILE"
          echo "TAXREF_FILE=$TAXREF_FILE" >> "$GITHUB_ENV"

      - name: Download official HDF fauna lists
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://www.hauts-de-france.developpement-durable.gouv.fr/IMG/ods/znieff_especesdeterminantes_faune_picardie.ods' -o "$RUNNER_TEMP/picardie.ods"
          curl --fail --location --retry 3 'https://www.hauts-de-france.developpement-durable.gouv.fr/IMG/ods/znieff_especesdeterminantes_faune_npdc.ods' -o "$RUNNER_TEMP/npdc.ods"

      - name: Reconcile TAXREF v14 identifiers to v18
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os, re, zipfile
          from collections import Counter
          from pathlib import Path
          from xml.etree import ElementTree as ET

          NS = {
            'office': 'urn:oasis:names:tc:opendocument:xmlns:office:1.0',
            'table': 'urn:oasis:names:tc:opendocument:xmlns:table:1.0',
            'text': 'urn:oasis:names:tc:opendocument:xmlns:text:1.0',
          }
          T = f"{{{NS['table']}}}"

          def clean(v): return re.sub(r'\s+', ' ', str(v or '').replace('\xa0',' ')).strip()
          def cell_text(cell):
            parts = [clean(''.join(p.itertext())) for p in cell.findall('.//text:p', NS)]
            parts = [p for p in parts if p]
            return ' '.join(parts) if parts else cell.attrib.get(f"{{{NS['office']}}}value", '')
          def read_sheet(path, sheet):
            with zipfile.ZipFile(path) as zf: root = ET.fromstring(zf.read('content.xml'))
            ss = root.find('office:body/office:spreadsheet', NS)
            table = next(t for t in list(ss) if t.tag == T+'table' and t.attrib.get(T+'name') == sheet)
            rows=[]
            for row in table.findall('table:table-row', NS):
              vals=[]
              for cell in row:
                if cell.tag not in {T+'table-cell', T+'covered-table-cell'}: continue
                repeat=min(int(cell.attrib.get(T+'number-columns-repeated','1')), 40)
                vals.extend([cell_text(cell)]*repeat)
              while vals and not clean(vals[-1]): vals.pop()
              if any(clean(v) for v in vals): rows.append(vals)
            header=[clean(v) for v in rows[0]]
            result=[]
            for vals in rows[1:]:
              vals=vals+['']*max(0,len(header)-len(vals))
              result.append(dict(zip(header,vals)))
            return result

          by_nom={}
          accepted={}
          with open(os.environ['TAXREF_FILE'],encoding='utf-8-sig',newline='') as f:
            for row in csv.DictReader(f,delimiter='\t'):
              try: cd_nom=int(clean(row.get('CD_NOM'))); cd_ref=int(clean(row.get('CD_REF')))
              except ValueError: continue
              kingdom=clean(row.get('REGNE')).casefold()
              by_nom[cd_nom]=(cd_ref, kingdom, clean(row.get('LB_NOM') or row.get('NOM_VALIDE')))
              if cd_nom==cd_ref: accepted[cd_ref]=(kingdom, clean(row.get('LB_NOM') or row.get('NOM_VALIDE')))

          configs=[('picardie','ZNIEFF_Liste_Faune_Picardie'),('npdc','ZNIEFF_Liste_Faune_NPdC')]
          for label,sheet in configs:
            rows=read_sheet(Path(f'/home/runner/work/_temp/{label}.ods'),sheet)
            stats=Counter(); unresolved=[]; remapped=[]; refs=[]
            for row in rows:
              raw_ref=clean(row.get('cd_ref')); raw_nom=clean(row.get('cd_nom'))
              if not raw_ref.isdigit():
                stats['source_without_cd_ref']+=1
                unresolved.append({'taxon':clean(row.get('Nom(s) cité')),'comment':clean(row.get('commentaire')),'cd_nom':raw_nom,'cd_ref':raw_ref})
                continue
              old_ref=int(raw_ref)
              hit=by_nom.get(old_ref)
              if hit and hit[1]=='animalia':
                new_ref=hit[0]; refs.append(new_ref)
                if new_ref==old_ref: stats['direct_current_ref']+=1
                else:
                  stats['remapped_old_ref']+=1
                  if len(remapped)<30: remapped.append({'oldRef':old_ref,'newRef':new_ref,'taxon':clean(row.get('Nom(s) cité')),'taxref18':hit[2]})
                continue
              if raw_nom.isdigit() and int(raw_nom) in by_nom and by_nom[int(raw_nom)][1]=='animalia':
                new_ref=by_nom[int(raw_nom)][0]; refs.append(new_ref); stats['via_cd_nom']+=1
                if len(remapped)<30: remapped.append({'oldRef':old_ref,'newRef':new_ref,'taxon':clean(row.get('Nom(s) cité')),'taxref18':by_nom[int(raw_nom)][2]})
              else:
                stats['unresolved']+=1
                if len(unresolved)<30: unresolved.append({'taxon':clean(row.get('Nom(s) cité')),'comment':clean(row.get('commentaire')),'cd_nom':raw_nom,'cd_ref':raw_ref})
            candidate=len(rows)-stats['source_without_cd_ref']
            matched=candidate-stats['unresolved']
            print(f'===== {label.upper()} =====')
            print(json.dumps({'rows':len(rows),'stats':dict(stats),'matched':matched,'matchRate':round(matched/candidate,6) if candidate else 1,'uniqueCurrentRefs':len(set(refs)),'remappedSample':remapped,'unresolvedSample':unresolved},ensure_ascii=False,indent=2))
          PY
