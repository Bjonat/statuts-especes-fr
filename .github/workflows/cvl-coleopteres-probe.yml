name: CVL aquatic beetles source probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cvl-coleopteres-probe.yml'

jobs:
  probe-cvl-coleopteres:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Download current aquatic beetles red list
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.laboratoireecoentomologie.com/wp-content/uploads/2026/02/Chapelin-Viscardi-et-al.-2025.-LRR-CVdL-Gyrins-dytiques-donacies.pdf'
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/coleopteres-2025.pdf"
          test "$(head -c 4 "$RUNNER_TEMP/coleopteres-2025.pdf")" = '%PDF'
          sha256sum "$RUNNER_TEMP/coleopteres-2025.pdf"
          pdftotext -layout "$RUNNER_TEMP/coleopteres-2025.pdf" "$RUNNER_TEMP/coleopteres-2025.txt"
          test -s "$RUNNER_TEMP/coleopteres-2025.txt"

      - name: Inspect table layout
        shell: bash
        run: |
          set -euo pipefail
          txt="$RUNNER_TEMP/coleopteres-2025.txt"
          grep -n -i -E 'liste rouge|catégor|categorie|tableau' "$txt" | tail -n 40 || true
          for taxon in 'Cybister lateralimarginalis' 'Plateumaris bracata' 'Gyrinus paykulli' 'Donacia simplex'; do
            echo "===== $taxon ====="
            grep -n -C 3 "$taxon" "$txt" | head -n 20 || true
          done
          tail -n 500 "$txt" | head -n 250 || true

      - name: Validate publication content
        shell: bash
        run: |
          set -euo pipefail
          txt="$RUNNER_TEMP/coleopteres-2025.txt"
          grep -q 'Cybister lateralimarginalis' "$txt"
          grep -q 'Gyrinus paykulli' "$txt"
          grep -q 'Donacia simplex' "$txt"
          grep -Eqi '\b(RE|CR\*?|EN|VU|NT|LC|DD)\b' "$txt"
          echo 'LRR Coléoptères aquatiques CVL 2025: publication accessible et texte exploitable.'
