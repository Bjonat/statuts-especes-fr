name: Nouvelle-Aquitaine ZNIEFF groups smoke test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'data-pipeline/regions/naq/**'
      - 'data-pipeline/regional.mjs'
      - '.github/workflows/naq-znieff-groups-smoke.yml'

jobs:
  build-naq-znieff-groups:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XLSX reader
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Download TAXREF v18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/taxref"
          curl --fail --location --retry 3 https://assets.patrinat.fr/files/referentiel/TAXREF_v18_2025.zip -o "$RUNNER_TEMP/taxref.zip" \
            || curl --fail --location --retry 3 https://geonature.fr/data/inpn/taxonomie/TAXREF_v18_2025.zip -o "$RUNNER_TEMP/taxref.zip"
          unzip -q "$RUNNER_TEMP/taxref.zip" -d "$RUNNER_TEMP/taxref"
          TAXREF_FILE="$(find "$RUNNER_TEMP/taxref" -type f -iname 'TAXREFv18.txt' | head -n 1)"
          test -n "$TAXREF_FILE"
          echo "TAXREF_FILE=$TAXREF_FILE" >> "$GITHUB_ENV"

      - name: Download NAQ ZNIEFF group workbooks
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/naq/download_znieff_groups.sh "$RUNNER_TEMP/naq-znieff-groups"
          echo "NAQ_ZNIEFF_GROUPS_DIR=$RUNNER_TEMP/naq-znieff-groups" >> "$GITHUB_ENV"

      - name: Build NAQ ZNIEFF group packages
        run: |
          mkdir -p "$RUNNER_TEMP/naq-packages"
          python data-pipeline/regions/naq/build_znieff_groups.py \
            --taxref "$TAXREF_FILE" \
            --input-dir "$NAQ_ZNIEFF_GROUPS_DIR" \
            --out-dir "$RUNNER_TEMP/naq-packages" \
            --min-match-rate 0.97
          echo "NAQ_PACKAGES_DIR=$RUNNER_TEMP/naq-packages" >> "$GITHUB_ENV"

      - name: Validate packages and sentinels
        run: |
          node - <<'NODE'
          import { loadRegionalPackages, UNPUBLISHABLE_SOURCE_IDS } from './data-pipeline/regional.mjs'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'

          const packages = await loadRegionalPackages(process.env.NAQ_PACKAGES_DIR)
          const byId = Object.fromEntries(packages.map((pkg) => [pkg.source.id, pkg]))
          const expected = [
            'dreal-naq-znieff-characees-2023',
            'dreal-naq-znieff-oiseaux-nicheurs-2023',
            'dreal-naq-znieff-araignees-2023',
            'dreal-naq-znieff-amphibiens-2024-09',
            'dreal-naq-znieff-reptiles-2024-09',
            'dreal-naq-znieff-mollusques-2025',
            'dreal-naq-znieff-orthopteres-2026',
            'dreal-naq-znieff-oiseaux-marins-2026',
          ]
          for (const id of expected) {
            assert.ok(byId[id], `paquet manquant: ${id}`)
            assert.equal(byId[id].source.official, true)
            assert.ok(!('url' in byId[id].source), `${id}: champ url interdit`)
            assert.ok(!UNPUBLISHABLE_SOURCE_IDS.has(id), `${id} ne doit pas être non publiable`)
          }

          const checks = [
            ['dreal-naq-znieff-characees-2023', 73555, false],
            ['dreal-naq-znieff-oiseaux-nicheurs-2023', 3571, false],
            ['dreal-naq-znieff-araignees-2023', 719819, true],
            ['dreal-naq-znieff-amphibiens-2024-09', 444427, true],
            ['dreal-naq-znieff-reptiles-2024-09', 701823, true],
            ['dreal-naq-znieff-mollusques-2025', 162701, false],
            ['dreal-naq-znieff-orthopteres-2026', 65899, true],
            ['dreal-naq-znieff-oiseaux-marins-2026', 3388, false],
          ]
          for (const [id, cdRef, partial] of checks) {
            const rows = byId[id].statuses.filter((status) => status.cdRef === cdRef)
            assert.ok(rows.some((status) => status.label === 'Déterminante ZNIEFF' && status.value === 'Oui'), `${id}/${cdRef}`)
            if (partial) {
              assert.ok(rows.some((status) => status.scope === 'partial' && status.scopeLabel), `${id}/${cdRef} partial`)
            }
          }

          const totals = Object.fromEntries(packages.map((pkg) => [pkg.source.id, pkg.statuses.length]))
          console.log(JSON.stringify(totals, null, 2))
          fs.writeFileSync(`${process.env.NAQ_PACKAGES_DIR}/summary.json`, JSON.stringify(totals, null, 2))
          NODE
