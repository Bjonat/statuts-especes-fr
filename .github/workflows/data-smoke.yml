name: Data source smoke test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'data-pipeline/**'
      - 'package.json'
      - '.github/workflows/data-smoke.yml'

jobs:
  build-official-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm install
          python -m pip install --disable-pip-version-check openpyxl xlrd
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Download TAXREF v18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/taxref"
          curl --fail --location --retry 3 https://assets.patrinat.fr/files/referentiel/TAXREF_v18_2025.zip -o "$RUNNER_TEMP/taxref.zip" \
            || curl --fail --location --retry 3 https://geonature.fr/data/inpn/taxonomie/TAXREF_v18_2025.zip -o "$RUNNER_TEMP/taxref.zip"
          unzip -q "$RUNNER_TEMP/taxref.zip" -d "$RUNNER_TEMP/taxref"
          TAXREF_FILE="$(find "$RUNNER_TEMP/taxref" -type f -iname 'TAXREFv18.txt' | head -n 1)"
          test -n "$TAXREF_FILE"
          echo "TAXREF_FILE=$TAXREF_FILE" >> "$GITHUB_ENV"

      - name: Download BDC Statuts v18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bdc"
          curl --fail --location --retry 3 https://assets.patrinat.fr/files/referentiel/BDC.zip -o "$RUNNER_TEMP/bdc.zip" \
            || curl --fail --location --retry 3 https://geonature.fr/data/inpn/taxonomie/BDC-STATUTS-v18.zip -o "$RUNNER_TEMP/bdc.zip"
          unzip -q "$RUNNER_TEMP/bdc.zip" -d "$RUNNER_TEMP/bdc"
          BDC_FILE=''
          while IFS= read -r candidate; do
            header="$(head -n 1 "$candidate" | tr '[:upper:]' '[:lower:]')"
            if grep -q 'cd_ref' <<< "$header" && grep -q 'cd_type_statut' <<< "$header"; then BDC_FILE="$candidate"; break; fi
          done < <(find "$RUNNER_TEMP/bdc" -type f -iname '*.csv')
          test -n "$BDC_FILE"
          echo "BDC_FILE=$BDC_FILE" >> "$GITHUB_ENV"

      - name: Download regional Auvergne-Rhône-Alpes ZNIEFF source
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/ara/download_dreal_znieff.sh "$RUNNER_TEMP/ara-znieff.ods"
          echo "ARA_ZNIEFF_FILE=$RUNNER_TEMP/ara-znieff.ods" >> "$GITHUB_ENV"

      - name: Download regional Auvergne-Rhône-Alpes LRR sources
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/ara/download_lrr.sh "$RUNNER_TEMP/ara-lrr"
          echo "ARA_LRR_DIR=$RUNNER_TEMP/ara-lrr" >> "$GITHUB_ENV"

      - name: Probe ZNIEFF Centre-Val de Loire 2026
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/znieff-cvl-2026.xls"
          curl --fail --location --retry 3 https://www.centre-val-de-loire.developpement-durable.gouv.fr/IMG/xls/listes_dz_cvl_actual_avril_2026.xls -o "$TARGET"
          if head -c 128 "$TARGET" | grep -Eqi '<!doctype html|<html'; then
            echo 'CVL_ZNIEFF_AVAILABLE=false' >> "$GITHUB_ENV"
            echo '::warning::Source ZNIEFF CVL 2026 momentanément indisponible (page de maintenance renvoyée).'
          else
            echo 'CVL_ZNIEFF_AVAILABLE=true' >> "$GITHUB_ENV"
            echo "CVL_ZNIEFF_FILE=$TARGET" >> "$GITHUB_ENV"
          fi

      - name: Inspect ZNIEFF Centre-Val de Loire 2026
        if: env.CVL_ZNIEFF_AVAILABLE == 'true'
        run: python data-pipeline/regions/inspect_workbook.py "$CVL_ZNIEFF_FILE"

      - name: Probe ZNIEFF Occitanie
        shell: bash
        run: |
          set -euo pipefail
          FLORA="$RUNNER_TEMP/znieff-occ-flore.xlsx"
          FAUNA="$RUNNER_TEMP/znieff-occ-faune.xlsx"
          curl --fail --location --retry 3 https://www.occitanie.developpement-durable.gouv.fr/IMG/xlsx/liste_taxons_det_flore_occitanie_cotation_v13-v16_osmose_public.xlsx -o "$FLORA"
          curl --fail --location --retry 3 https://www.occitanie.developpement-durable.gouv.fr/IMG/xlsx/listes_faune_znieff_20240725.xlsx -o "$FAUNA"
          if [ "$(head -c 2 "$FLORA")" = 'PK' ] && [ "$(head -c 2 "$FAUNA")" = 'PK' ]; then
            echo 'OCC_ZNIEFF_AVAILABLE=true' >> "$GITHUB_ENV"
            echo "OCC_ZNIEFF_FLORA_FILE=$FLORA" >> "$GITHUB_ENV"
            echo "OCC_ZNIEFF_FAUNA_FILE=$FAUNA" >> "$GITHUB_ENV"
          else
            echo 'OCC_ZNIEFF_AVAILABLE=false' >> "$GITHUB_ENV"
            echo '::warning::Sources ZNIEFF Occitanie momentanément indisponibles (page de maintenance renvoyée).'
          fi

      - name: Inspect ZNIEFF Occitanie
        if: env.OCC_ZNIEFF_AVAILABLE == 'true'
        run: |
          python data-pipeline/regions/inspect_workbook.py "$OCC_ZNIEFF_FLORA_FILE"
          python data-pipeline/regions/inspect_workbook.py "$OCC_ZNIEFF_FAUNA_FILE"

      - name: Probe regional sources Nouvelle-Aquitaine
        shell: bash
        run: |
          set -euo pipefail
          ZNIEFF="$RUNNER_TEMP/znieff-naq-flore.xlsx"
          EEE="$RUNNER_TEMP/eee-naq-2022.xlsx"
          curl --fail --location --retry 3 https://obv-na.fr/ofsa/ressources/4_ref_bioeval/CBN_2019-Liste_ED_ZNIEFF_flore_Nouvelle-Aquitaine_v1.2_tb.xlsx -o "$ZNIEFF"
          curl --fail --location --retry 3 https://obv-na.fr/ofsa/ressources/5_ref_eee/CBNSA_2022-Liste_hierarchisee_PEE_NA_v1.0.xlsx -o "$EEE"
          if [ "$(head -c 2 "$ZNIEFF")" = 'PK' ] && [ "$(head -c 2 "$EEE")" = 'PK' ]; then
            echo 'NAQ_REGIONAL_AVAILABLE=true' >> "$GITHUB_ENV"
            echo "NAQ_ZNIEFF_FILE=$ZNIEFF" >> "$GITHUB_ENV"
            echo "NAQ_EEE_FILE=$EEE" >> "$GITHUB_ENV"
          else
            echo 'NAQ_REGIONAL_AVAILABLE=false' >> "$GITHUB_ENV"
            echo '::warning::Sources régionales OBV Nouvelle-Aquitaine indisponibles pour ce run.'
          fi

      - name: Download regional ZNIEFF groups Nouvelle-Aquitaine
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/naq/download_znieff_groups.sh "$RUNNER_TEMP/naq-znieff-groups"
          echo "NAQ_ZNIEFF_GROUPS_DIR=$RUNNER_TEMP/naq-znieff-groups" >> "$GITHUB_ENV"

      - name: Inspect regional sources Nouvelle-Aquitaine
        if: env.NAQ_REGIONAL_AVAILABLE == 'true'
        run: |
          python data-pipeline/regions/inspect_workbook.py "$NAQ_ZNIEFF_FILE"
          python data-pipeline/regions/inspect_workbook.py "$NAQ_EEE_FILE"

      - name: Download regional Bretagne sources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://www.data.gouv.fr/api/1/datasets/r/4ada0b2b-d56e-44a9-8532-9ca2335c625b -o "$RUNNER_TEMP/bre-znieff.csv"
          curl --fail --location --retry 3 https://www.data.gouv.fr/api/1/datasets/r/937614a8-3a9a-449c-9a12-0c2e2fa5ae96 -o "$RUNNER_TEMP/bre-lrr.csv"
          bash data-pipeline/regions/bre/download_oeb_responsabilite.sh "$RUNNER_TEMP/bre-responsabilite.csv"
          grep -q 'CD_NOM' "$RUNNER_TEMP/bre-znieff.csv"
          grep -q 'RESULTAT_EVALUATION' "$RUNNER_TEMP/bre-lrr.csv"
          sha256sum "$RUNNER_TEMP/bre-znieff.csv" "$RUNNER_TEMP/bre-lrr.csv" "$RUNNER_TEMP/bre-responsabilite.csv"
          echo "BRE_ZNIEFF_FILE=$RUNNER_TEMP/bre-znieff.csv" >> "$GITHUB_ENV"
          echo "BRE_LRR_FILE=$RUNNER_TEMP/bre-lrr.csv" >> "$GITHUB_ENV"
          echo "BRE_RESPONSABILITE_FILE=$RUNNER_TEMP/bre-responsabilite.csv" >> "$GITHUB_ENV"

      - name: Download regional Normandie LRR sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nor-lrr"
          curl --fail --location --retry 3 'https://www.anbdd.fr/wp-content/uploads/2025/01/LR_Oiseaux_Nicheurs-_Normandie_2024_telechargement.xlsx' -o "$RUNNER_TEMP/nor-lrr/oiseaux-2024.xlsx"
          curl --fail --location --retry 3 'https://www.anbdd.fr/wp-content/uploads/2022/05/LR_RHOPALO_tableau-de-synthese_ANBDD.xlsx' -o "$RUNNER_TEMP/nor-lrr/rhopaloceres.xlsx"
          curl --fail --location --retry 3 'https://www.anbdd.fr/wp-content/uploads/2022/11/Tableau_Liste_Rouge_Mammiferes_Normandie_2022-VF.xlsx' -o "$RUNNER_TEMP/nor-lrr/mammiferes-2022.xlsx"
          curl --fail --location --retry 3 'https://www.anbdd.fr/wp-content/uploads/2023/05/Liste_Rouge_ORTHO_Normandie_ANBDD_2022.xlsx' -o "$RUNNER_TEMP/nor-lrr/orthopteres-2022.xlsx"
          curl --fail --location --retry 3 'https://www.anbdd.fr/wp-content/uploads/2022/09/Tableau-LR-Amphibiens-Normandie-2022.xlsx' -o "$RUNNER_TEMP/nor-lrr/amphibiens-2022.xlsx"
          curl --fail --location --retry 3 'https://www.anbdd.fr/wp-content/uploads/2022/09/LR_ODONATES_tableau-de-synthese_pour_ANBDD_VF.xlsx' -o "$RUNNER_TEMP/nor-lrr/odonates.xlsx"
          curl --fail --location --retry 3 'https://www.anbdd.fr/publication/liste-rouge-des-reptiles-de-normandie/tableau-lr-reptiles-normandie-2022/' -o "$RUNNER_TEMP/nor-lrr/reptiles-2022.xlsx"
          for file in "$RUNNER_TEMP"/nor-lrr/*.xlsx; do test "$(head -c 2 "$file")" = 'PK'; done
          sha256sum "$RUNNER_TEMP"/nor-lrr/*.xlsx
          echo "NOR_LRR_DIR=$RUNNER_TEMP/nor-lrr" >> "$GITHUB_ENV"

      - name: Download regional Normandie ZNIEFF HN flora source
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/nor/download_digitale_znieff.sh "$RUNNER_TEMP/digitale-znieff.xlsx"
          echo "NOR_ZNIEFF_SOURCE=$RUNNER_TEMP/digitale-znieff.xlsx" >> "$GITHUB_ENV"

      - name: Download regional Île-de-France source
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/idf/download_geonat_statuts.sh "$RUNNER_TEMP/idf-statuts.csv"
          echo "IDF_SOURCE=$RUNNER_TEMP/idf-statuts.csv" >> "$GITHUB_ENV"

      - name: Download regional Centre-Val de Loire LRR sources
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/cvl/download_lrr.sh "$RUNNER_TEMP/cvl-lrr"
          echo "CVL_LRR_DIR=$RUNNER_TEMP/cvl-lrr" >> "$GITHUB_ENV"

      - name: Download regional Centre-Val de Loire ZNIEFF source
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/cvl/download_znieff.sh "$RUNNER_TEMP/cvl-znieff.xls"
          echo "CVL_ZNIEFF_SOURCE=$RUNNER_TEMP/cvl-znieff.xls" >> "$GITHUB_ENV"

      - name: Download regional Grand Est ZNIEFF fauna source
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/ges/download_odonat_znieff.sh "$RUNNER_TEMP/ges-znieff-fauna.xlsx"
          echo "GES_ZNIEFF_FAUNA_FILE=$RUNNER_TEMP/ges-znieff-fauna.xlsx" >> "$GITHUB_ENV"

      - name: Download regional Grand Est ZNIEFF flora source
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/ges/download_odonat_znieff_flora.sh "$RUNNER_TEMP/ges-znieff-flora.xlsx"
          echo "GES_ZNIEFF_FLORA_FILE=$RUNNER_TEMP/ges-znieff-flora.xlsx" >> "$GITHUB_ENV"

      - name: Download regional Grand Est LRR sources
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/ges/download_odonat_lrr.sh "$RUNNER_TEMP/ges-lrr"
          echo "GES_LRR_DIR=$RUNNER_TEMP/ges-lrr" >> "$GITHUB_ENV"

      - name: Download regional BFC master status workbook
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/bfc/download_arb_statuts.sh "$RUNNER_TEMP/bfc-statuts.xlsx"
          echo "BFC_SOURCE=$RUNNER_TEMP/bfc-statuts.xlsx" >> "$GITHUB_ENV"

      - name: Download regional PACA ZNIEFF and LRR sources
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/pac/download_sources.sh "$RUNNER_TEMP/pac-sources"
          echo "PAC_SOURCES_DIR=$RUNNER_TEMP/pac-sources" >> "$GITHUB_ENV"

      - name: Download regional PDL ZNIEFF sources
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/pdl/download_znieff.sh "$RUNNER_TEMP/pdl-znieff"
          echo "PDL_ZNIEFF_DIR=$RUNNER_TEMP/pdl-znieff" >> "$GITHUB_ENV"

      - name: Build regional packages
        shell: bash
        run: |
          set -euo pipefail
          REGIONAL_DIR="$RUNNER_TEMP/regional-packages"
          mkdir -p "$REGIONAL_DIR"
          python data-pipeline/regions/ara/build_dreal_znieff.py --taxref "$TAXREF_FILE" --ods "$ARA_ZNIEFF_FILE" --out "$REGIONAL_DIR/ara-znieff.json" --min-match-rate 0.97
          python data-pipeline/regions/ara/build_lrr.py --taxref "$TAXREF_FILE" --input-dir "$ARA_LRR_DIR" --out-dir "$REGIONAL_DIR" --min-match-rate 0.97
          if [ "${NAQ_REGIONAL_AVAILABLE:-false}" = 'true' ]; then
            python data-pipeline/regions/naq/build_znieff.py --taxref "$TAXREF_FILE" --workbook "$NAQ_ZNIEFF_FILE" --out "$REGIONAL_DIR/naq-znieff-flora.json"
          fi
          python data-pipeline/regions/naq/build_znieff_groups.py --taxref "$TAXREF_FILE" --input-dir "$NAQ_ZNIEFF_GROUPS_DIR" --out-dir "$REGIONAL_DIR" --min-match-rate 0.97
          python data-pipeline/regions/bre/build_oeb.py --taxref "$TAXREF_FILE" --znieff "$BRE_ZNIEFF_FILE" --lrr "$BRE_LRR_FILE" --responsabilite "$BRE_RESPONSABILITE_FILE" --out-dir "$REGIONAL_DIR" --min-match-rate 0.97
          python data-pipeline/regions/nor/build_anbdd_lrr.py --taxref "$TAXREF_FILE" --input-dir "$NOR_LRR_DIR" --out-dir "$REGIONAL_DIR" --min-match-rate 0.97
          python data-pipeline/regions/nor/build_digitale_znieff_hn.py --taxref "$TAXREF_FILE" --source "$NOR_ZNIEFF_SOURCE" --out "$REGIONAL_DIR/nor-znieff-hn-flora.json" --min-match-rate 0.97
          python data-pipeline/regions/idf/build_geonat_znieff.py --taxref "$TAXREF_FILE" --source "$IDF_SOURCE" --out "$REGIONAL_DIR/idf-znieff.json" --min-match-rate 0.97
          python data-pipeline/regions/idf/build_geonat_lrr.py --taxref "$TAXREF_FILE" --source "$IDF_SOURCE" --out-dir "$REGIONAL_DIR" --min-match-rate 0.97
          python data-pipeline/regions/cvl/build_arb_lrr.py --taxref "$TAXREF_FILE" --odonates "$CVL_LRR_DIR/odonates-2022.pdf" --papillons "$CVL_LRR_DIR/papillons-2024.pdf" --coleopteres "$CVL_LRR_DIR/coleopteres-2025.pdf" --out-dir "$REGIONAL_DIR" --min-match-rate 0.97
          python data-pipeline/regions/cvl/build_znieff.py --taxref "$TAXREF_FILE" --source "$CVL_ZNIEFF_SOURCE" --out "$REGIONAL_DIR/cvl-znieff.json" --min-match-rate 0.97
          python data-pipeline/regions/ges/build_odonat_znieff.py --taxref "$TAXREF_FILE" --source "$GES_ZNIEFF_FAUNA_FILE" --out "$REGIONAL_DIR/ges-znieff-fauna.json" --min-match-rate 0.98
          python data-pipeline/regions/ges/build_odonat_znieff_flora.py --taxref "$TAXREF_FILE" --source "$GES_ZNIEFF_FLORA_FILE" --out "$REGIONAL_DIR/ges-znieff-flora.json" --min-match-rate 0.98
          python data-pipeline/regions/ges/build_odonat_lrr.py --taxref "$TAXREF_FILE" --input-dir "$GES_LRR_DIR" --out-dir "$REGIONAL_DIR" --min-match-rate 0.97
          python data-pipeline/regions/bfc/build_arb_statuts.py --taxref "$TAXREF_FILE" --source "$BFC_SOURCE" --out "$REGIONAL_DIR/bfc-statuts.json" --min-match-rate 0.97
          python data-pipeline/regions/pac/build_znieff.py --taxref "$TAXREF_FILE" --input-dir "$PAC_SOURCES_DIR" --out-dir "$REGIONAL_DIR" --min-match-rate 0.97
          python data-pipeline/regions/pac/build_lrr.py --taxref "$TAXREF_FILE" --input-dir "$PAC_SOURCES_DIR" --out-dir "$REGIONAL_DIR" --min-match-rate 0.97
          python data-pipeline/regions/pdl/build_znieff.py --taxref "$TAXREF_FILE" --input-dir "$PDL_ZNIEFF_DIR" --out-dir "$REGIONAL_DIR" --min-match-rate 0.97
          echo "REGIONAL_DIR=$REGIONAL_DIR" >> "$GITHUB_ENV"

      - name: Diagnose official source volumes
        run: node data-pipeline/analyze.mjs --taxref "$TAXREF_FILE" --bdc "$BDC_FILE"

      - name: Run pipeline tests
        run: node --test data-pipeline/*.test.mjs

      - name: Build enriched official catalog
        run: node data-pipeline/build.mjs --taxref "$TAXREF_FILE" --bdc "$BDC_FILE" --regional-dir "$REGIONAL_DIR" --out public/data

      - name: Validate generated manifest
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('public/data/manifest.json', 'utf8'))
          const regions = ['ARA', 'BFC', 'BRE', 'CVL', 'COR', 'GES', 'HDF', 'IDF', 'NOR', 'NAQ', 'OCC', 'PDL', 'PAC']
          const realms = ['flora', 'fauna']
          const manifestRegions = new Set(manifest.regions?.map((region) => region.code))
          const valid = manifest.schemaVersion === 3 && manifest.official === true && manifest.taxrefVersion === '18' && manifest.bdcVersion === '18'
            && manifestRegions.size === regions.length && regions.every((region) => manifestRegions.has(region))
            && manifest.files?.statusDefinitions?.file && realms.every((realm) => manifest.files?.taxa?.[realm]?.file)
            && realms.every((realm) => regions.every((region) => manifest.files?.statusLinks?.[realm]?.[region]?.file))
          if (!valid) process.exit(1)
          const required = [
            'dreal-ara-znieff-2023-06',
            'dreal-ara-lrr-amphibiens-2024', 'dreal-ara-lrr-reptiles-2024',
            'dreal-ara-lrr-chiropteres-2024', 'dreal-ara-lrr-oiseaux-nicheurs-2024',
            'dreal-ara-lrr-mammiferes-2024',
            'oeb-bretagne-znieff-csv-2026-01-29', 'oeb-bretagne-lrr-csv-2026-01-29',
            'oeb-bretagne-responsabilite-csv-2026-07-29',
            'anbdd-normandie-lrr-oiseaux-nicheurs-2024', 'anbdd-normandie-lrr-mammiferes-2022',
            'anbdd-normandie-lrr-amphibiens-2022', 'anbdd-normandie-lrr-reptiles-2022',
            'anbdd-normandie-lrr-odonates-2022', 'anbdd-normandie-lrr-orthopteres-2022',
            'anbdd-normandie-lrr-rhopaloceres-2022', 'cbnhdf-digitale-znieff-hn-flora-2026-03-31',
            'arb-idf-geonat-statuts-znieff-2026',
            'arb-idf-lrr-amphibiens-2023', 'arb-idf-lrr-reptiles-2023',
            'arb-idf-lrr-oiseaux-nicheurs-2018', 'arb-idf-lrr-chiropteres-2017',
            'arb-idf-lrr-odonates-2014', 'arb-idf-lrr-rhopaloceres-zygenes-2016',
            'arb-idf-lrr-orthopteroides-2018', 'arb-idf-lrr-flore-vasculaire-2014',
            'arb-cvl-lrr-odonates-2022', 'arb-cvl-lrr-papillons-2024',
            'ecoentomologie-cvl-lrr-coleopteres-aquatiques-2025',
            'dreal-cvl-znieff-2026-04',
            'dreal-ges-odonat-znieff-fauna-2026-v2.2',
            'dreal-ges-znieff-flora-2024-08-v1.0',
            'dreal-ges-odonat-lrr-amphibiens-2023',
            'dreal-ges-odonat-lrr-reptiles-2023',
            'dreal-ges-odonat-lrr-mollusques-2023-v1.1',
            'dreal-ges-odonat-lrr-odonates-2023',
            'dreal-ges-odonat-lrr-orthopteres-2024',
            'dreal-ges-odonat-lrr-oiseaux-nicheurs-2024',
            'dreal-ges-odonat-lrr-branchiopodes-2025',
            'dreal-ges-odonat-lrr-decapodes-2025',
            'dreal-ges-odonat-lrr-papillons-jour-2025',
            'dreal-ges-odonat-lrr-poissons-2024',
            'dreal-bfc-statuts-2026-03-03',
            'dreal-naq-znieff-characees-2023',
            'dreal-naq-znieff-oiseaux-nicheurs-2023',
            'dreal-naq-znieff-araignees-2023',
            'dreal-naq-znieff-amphibiens-2024-09',
            'dreal-naq-znieff-reptiles-2024-09',
            'dreal-naq-znieff-mollusques-2025',
            'dreal-naq-znieff-orthopteres-2026',
            'dreal-naq-znieff-oiseaux-marins-2026',
            'dreal-pac-znieff-fauna-2024-01',
            'dreal-pac-znieff-flora-2016',
            'dreal-pac-lrr-oiseaux-2020',
            'dreal-pac-lrr-odonates-2017',
            'dreal-pac-lrr-papillons-2024',
            'dreal-pac-lrr-flore-2015',
            'dreal-pac-lrr-amphibiens-2016',
            'dreal-pac-lrr-reptiles-2016',
            'dreal-pac-lrr-orthopteres-2018',
            'dreal-pdl-znieff-faune-2018',
            'dreal-pdl-znieff-flore-2018',
          ]
          if (process.env.NAQ_REGIONAL_AVAILABLE === 'true') required.push('obv-na-znieff-flore-2019-v1.2')
          const ids = new Set(manifest.sources.map((source) => source.id))
          for (const id of required) if (!ids.has(id)) throw new Error(`Source régionale absente du manifeste enrichi : ${id}`)
          console.log(manifest)
          NODE
          du -h public/data/*
          du -ch public/data/*.json | tail -n 1

      - name: Validate field sentinel cases
        run: node data-pipeline/validate-generated.mjs --dir public/data

      - name: Upload generated dataset
        uses: actions/upload-artifact@v4
        with:
          name: official-dataset-v18-metropole
          path: public/data/
          if-no-files-found: error
          retention-days: 7
