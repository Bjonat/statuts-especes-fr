name: Data source smoke test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'data-pipeline/**'
      - 'package.json'
      - '.github/workflows/data-smoke.yml'

jobs:
  build-official-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Download TAXREF v18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/taxref"
          curl --fail --location --retry 3 \
            https://assets.patrinat.fr/files/referentiel/TAXREF_v18_2025.zip \
            -o "$RUNNER_TEMP/taxref.zip" \
          || curl --fail --location --retry 3 \
            https://geonature.fr/data/inpn/taxonomie/TAXREF_v18_2025.zip \
            -o "$RUNNER_TEMP/taxref.zip"
          unzip -q "$RUNNER_TEMP/taxref.zip" -d "$RUNNER_TEMP/taxref"
          TAXREF_FILE="$(find "$RUNNER_TEMP/taxref" -type f -iname 'TAXREFv18.txt' | head -n 1)"
          test -n "$TAXREF_FILE"
          echo "TAXREF_FILE=$TAXREF_FILE" >> "$GITHUB_ENV"

      - name: Download BDC Statuts v18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bdc"
          curl --fail --location --retry 3 \
            https://assets.patrinat.fr/files/referentiel/BDC.zip \
            -o "$RUNNER_TEMP/bdc.zip" \
          || curl --fail --location --retry 3 \
            https://geonature.fr/data/inpn/taxonomie/BDC-STATUTS-v18.zip \
            -o "$RUNNER_TEMP/bdc.zip"
          unzip -q "$RUNNER_TEMP/bdc.zip" -d "$RUNNER_TEMP/bdc"

          BDC_FILE=''
          while IFS= read -r candidate; do
            header="$(head -n 1 "$candidate" | tr '[:upper:]' '[:lower:]')"
            if grep -q 'cd_ref' <<< "$header" && grep -q 'cd_type_statut' <<< "$header"; then
              BDC_FILE="$candidate"
              break
            fi
          done < <(find "$RUNNER_TEMP/bdc" -type f -iname '*.csv')

          test -n "$BDC_FILE"
          echo "BDC_FILE=$BDC_FILE" >> "$GITHUB_ENV"

      - name: Download ZNIEFF Centre-Val de Loire for schema diagnostic
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/znieff-cvl.xls"
          curl --fail --location --retry 3 \
            https://www.centre-val-de-loire.developpement-durable.gouv.fr/IMG/xls/listes_dz_cvl_actual_avril_2026.xls \
            -o "$TARGET"

          if head -c 128 "$TARGET" | grep -Eqi '<!doctype html|<html'; then
            echo '::warning::La DREAL renvoie actuellement une page de maintenance pour le XLS 2026. Utilisation du XLS 2025 uniquement pour diagnostiquer le schéma; aucune donnée 2025 ne sera publiée comme 2026.'
            curl --fail --location --retry 3 \
              https://www.centre-val-de-loire.developpement-durable.gouv.fr/IMG/xls/listes_dz_cvl_actual_fevrier_2025.xls \
              -o "$TARGET"
            echo 'CVL_ZNIEFF_DIAGNOSTIC_YEAR=2025' >> "$GITHUB_ENV"
          else
            echo 'CVL_ZNIEFF_DIAGNOSTIC_YEAR=2026' >> "$GITHUB_ENV"
          fi

          test -s "$TARGET"
          echo "CVL_ZNIEFF_FILE=$TARGET" >> "$GITHUB_ENV"

      - name: Inspect ZNIEFF Centre-Val de Loire workbook
        run: |
          echo "Millésime utilisé pour le diagnostic de schéma: $CVL_ZNIEFF_DIAGNOSTIC_YEAR"
          node data-pipeline/regions/cvl/inspect-znieff.mjs "$CVL_ZNIEFF_FILE"

      - name: Diagnose official source volumes
        run: node data-pipeline/analyze.mjs --taxref "$TAXREF_FILE" --bdc "$BDC_FILE"

      - name: Run pipeline tests
        run: node --test data-pipeline/*.test.mjs

      - name: Build official catalog
        run: node data-pipeline/build.mjs --taxref "$TAXREF_FILE" --bdc "$BDC_FILE" --out public/data

      - name: Validate generated manifest
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('public/data/manifest.json', 'utf8'))
          const regions = ['ARA', 'BFC', 'BRE', 'CVL', 'COR', 'GES', 'HDF', 'IDF', 'NOR', 'NAQ', 'OCC', 'PDL', 'PAC']
          const realms = ['flora', 'fauna']
          const manifestRegions = new Set(manifest.regions?.map((region) => region.code))
          const valid = manifest.schemaVersion === 3
            && manifest.official === true
            && manifest.taxrefVersion === '18'
            && manifest.bdcVersion === '18'
            && manifestRegions.size === regions.length
            && regions.every((region) => manifestRegions.has(region))
            && manifest.files?.statusDefinitions?.file
            && realms.every((realm) => manifest.files?.taxa?.[realm]?.file)
            && realms.every((realm) => regions.every((region) => manifest.files?.statusLinks?.[realm]?.[region]?.file))
          if (!valid) process.exit(1)
          console.log(manifest)
          NODE
          du -h public/data/*
          du -ch public/data/*.json | tail -n 1

      - name: Validate field sentinel cases
        run: node data-pipeline/validate-generated.mjs --dir public/data

      - name: Upload generated dataset
        uses: actions/upload-artifact@v4
        with:
          name: official-dataset-v18-metropole
          path: public/data/
          if-no-files-found: error
          retention-days: 7
