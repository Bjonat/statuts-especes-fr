name: HDF ZNIEFF fauna source probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hdf-znieff-fauna-probe.yml'
      - 'data-pipeline/regions/hdf/**'
  workflow_dispatch:

jobs:
  probe-hdf-fauna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official HDF fauna ODS files
        shell: bash
        run: |
          set -euo pipefail
          PICARDIE='https://www.hauts-de-france.developpement-durable.gouv.fr/IMG/ods/znieff_especesdeterminantes_faune_picardie.ods'
          NPDC='https://www.hauts-de-france.developpement-durable.gouv.fr/IMG/ods/znieff_especesdeterminantes_faune_npdc.ods'
          curl --fail --location --retry 3 --user-agent 'statuts-especes-fr/1.0' "$PICARDIE" -o "$RUNNER_TEMP/picardie.ods"
          curl --fail --location --retry 3 --user-agent 'statuts-especes-fr/1.0' "$NPDC" -o "$RUNNER_TEMP/npdc.ods"
          file "$RUNNER_TEMP/picardie.ods" "$RUNNER_TEMP/npdc.ods"
          sha256sum "$RUNNER_TEMP/picardie.ods" "$RUNNER_TEMP/npdc.ods"
          unzip -tq "$RUNNER_TEMP/picardie.ods"
          unzip -tq "$RUNNER_TEMP/npdc.ods"

      - name: Inspect ODS sheets and source contract
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import zipfile
          from collections import Counter
          from pathlib import Path
          from xml.etree import ElementTree as ET

          NS = {
              'office': 'urn:oasis:names:tc:opendocument:xmlns:office:1.0',
              'table': 'urn:oasis:names:tc:opendocument:xmlns:table:1.0',
              'text': 'urn:oasis:names:tc:opendocument:xmlns:text:1.0',
          }
          T = f"{{{NS['table']}}}"

          def cell_text(cell):
              parts = []
              for p in cell.findall('.//text:p', NS):
                  text = ''.join(p.itertext()).strip()
                  if text:
                      parts.append(text)
              if parts:
                  return ' '.join(parts)
              return cell.attrib.get(f"{{{NS['office']}}}value", '')

          def rows_from_table(table):
              for row in table.findall('table:table-row', NS):
                  values = []
                  row_repeat = min(int(row.attrib.get(T + 'number-rows-repeated', '1')), 1000)
                  for cell in row:
                      if cell.tag not in {T + 'table-cell', T + 'covered-table-cell'}:
                          continue
                      repeat = min(int(cell.attrib.get(T + 'number-columns-repeated', '1')), 60)
                      value = cell_text(cell)
                      values.extend([value] * repeat)
                      if len(values) >= 60:
                          break
                  values = values[:60]
                  while values and values[-1] == '':
                      values.pop()
                  if not any(str(v).strip() for v in values):
                      continue
                  for _ in range(row_repeat):
                      yield values

          def inspect(path, expected_sheet):
              with zipfile.ZipFile(path) as zf:
                  root = ET.fromstring(zf.read('content.xml'))
              spreadsheet = root.find('office:body/office:spreadsheet', NS)
              tables = [table for table in list(spreadsheet) if table.tag == T + 'table']
              sheet_names = [table.attrib.get(T + 'name', '?') for table in tables]
              table = next(table for table in tables if table.attrib.get(T + 'name') == expected_sheet)
              rows = list(rows_from_table(table))
              header = rows[0]
              records = []
              for values in rows[1:]:
                  padded = values + [''] * max(0, len(header) - len(values))
                  records.append(dict(zip(header, padded)))

              cd_refs = [str(row.get('cd_ref', '')).strip() for row in records]
              valid_refs = [value for value in cd_refs if value.isdigit()]
              duplicates = Counter(valid_refs)
              duplicate_refs = {key: count for key, count in duplicates.items() if count > 1}
              comments = [str(row.get('commentaire', '')).strip() for row in records if str(row.get('commentaire', '')).strip()]
              return {
                  'sheets': sheet_names,
                  'sheet': expected_sheet,
                  'header': header,
                  'dataRows': len(records),
                  'validCdRefRows': len(valid_refs),
                  'emptyOrInvalidCdRefRows': len(records) - len(valid_refs),
                  'uniqueCdRefs': len(set(valid_refs)),
                  'duplicateCdRefs': len(duplicate_refs),
                  'duplicateSamples': dict(list(sorted(duplicate_refs.items()))[:20]),
                  'regions': dict(Counter(str(row.get('Libellé de la région', '')).strip() for row in records)),
                  'regionCodes': dict(Counter(str(row.get('Code INSEE région', '')).strip() for row in records)),
                  'kingdoms': dict(Counter(str(row.get('Règne', '')).strip() for row in records)),
                  'groups': dict(Counter(str(row.get('groupe', '')).strip() for row in records).most_common()),
                  'nonEmptyComments': len(comments),
                  'commentSamples': comments[:30],
              }

          configs = [
              ('picardie', 'ZNIEFF_Liste_Faune_Picardie'),
              ('npdc', 'ZNIEFF_Liste_Faune_NPdC'),
          ]
          for label, sheet in configs:
              print(f'===== {label.upper()} =====')
              report = inspect(Path(f'/home/runner/work/_temp/{label}.ods'), sheet)
              print(json.dumps(report, ensure_ascii=False, indent=2))
              assert report['dataRows'] > 300
              assert report['validCdRefRows'] == report['dataRows']
              assert report['kingdoms'] == {'Animalia': report['dataRows']}
          PY
