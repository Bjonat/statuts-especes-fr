name: NAQ FAUNA reference probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/naq-fauna-reference-probe.yml'

jobs:
  probe-fauna-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect FAUNA reference page and assets
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/fauna.html"
          curl --fail --location --retry 3 \
            'https://observatoire-fauna.fr/programmes/referentiel-especes/rechercher-especes' \
            -o "$page"
          echo '===== download/csv/reference hints in HTML ====='
          grep -Eio '.{0,140}(référentiel complet|referentiel complet|download|telecharg|télécharg|\.csv|\.tsv|export).{0,180}' "$page" | head -n 120 || true
          echo '===== script assets ====='
          grep -Eo '<script[^>]+src=["'"'][^"'"']+' "$page" | sed -E 's/.*src=["'"']//g' | tee "$RUNNER_TEMP/scripts.txt" || true

          : > "$RUNNER_TEMP/assets.txt"
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            case "$src" in
              http*) url="$src" ;;
              /*) url="https://observatoire-fauna.fr$src" ;;
              *) url="https://observatoire-fauna.fr/programmes/referentiel-especes/$src" ;;
            esac
            safe="$(printf '%s' "$src" | tr '/?&=' '____')"
            out="$RUNNER_TEMP/asset-${safe##*_}"
            if curl --fail --location --retry 2 "$url" -o "$out" 2>/dev/null; then
              echo "$url|$out" >> "$RUNNER_TEMP/assets.txt"
            fi
          done < "$RUNNER_TEMP/scripts.txt"

      - name: Search JavaScript for export endpoints
        shell: bash
        run: |
          set -euo pipefail
          echo '===== endpoint candidates ====='
          while IFS='|' read -r url file; do
            [ -f "$file" ] || continue
            hits="$(grep -Eio '.{0,180}(référentiel complet|referentiel complet|download|telecharg|télécharg|csv|export|referentiel-especes).{0,220}' "$file" | head -n 80 || true)"
            if [ -n "$hits" ]; then
              echo "### $url"
              printf '%s\n' "$hits"
            fi
          done < "$RUNNER_TEMP/assets.txt"

      - name: Extract URL-like candidates
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/fauna.html" $(cut -d'|' -f2 "$RUNNER_TEMP/assets.txt" 2>/dev/null || true) \
            | grep -Eo 'https?://[^"'"' <>]+' \
            | grep -Ei 'fauna|referentiel|csv|download|export' \
            | sort -u \
            | head -n 200 || true
