name: Bretagne regional sources smoke test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'data-pipeline/regions/bre/**'
      - 'data-pipeline/regional.mjs'
      - 'data-pipeline/run-adapter.mjs'
      - 'data-pipeline/diagnostics.mjs'
      - 'data-pipeline/diagnostics.test.mjs'
      - 'data-pipeline/adapters/**'
      - 'data-pipeline/adapter-runner.test.mjs'
      - 'data-pipeline/oeb-lrr-adapter.test.mjs'
      - 'data-pipeline/migrated-source-matrix.mjs'
      - 'data-pipeline/migrated-source-matrix.test.mjs'
      - 'data-pipeline/regions/ready-sources.json'
      - '.github/workflows/bre-regional-smoke.yml'
      - '.github/workflows/regional-adapters-matrix.yml'

jobs:
  build-bretagne-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download TAXREF v18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/taxref"
          curl --fail --location --retry 3 https://assets.patrinat.fr/files/referentiel/TAXREF_v18_2025.zip -o "$RUNNER_TEMP/taxref.zip" \
            || curl --fail --location --retry 3 https://geonature.fr/data/inpn/taxonomie/TAXREF_v18_2025.zip -o "$RUNNER_TEMP/taxref.zip"
          unzip -q "$RUNNER_TEMP/taxref.zip" -d "$RUNNER_TEMP/taxref"
          TAXREF_FILE="$(find "$RUNNER_TEMP/taxref" -type f -iname 'TAXREFv18.txt' | head -n 1)"
          test -n "$TAXREF_FILE"
          echo "TAXREF_FILE=$TAXREF_FILE" >> "$GITHUB_ENV"

      - name: Download OEB Bretagne CSVs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://www.data.gouv.fr/api/1/datasets/r/4ada0b2b-d56e-44a9-8532-9ca2335c625b \
            -o "$RUNNER_TEMP/bre-znieff.csv"
          curl --fail --location --retry 3 \
            https://www.data.gouv.fr/api/1/datasets/r/937614a8-3a9a-449c-9a12-0c2e2fa5ae96 \
            -o "$RUNNER_TEMP/bre-lrr.csv"
          bash data-pipeline/regions/bre/download_oeb_responsabilite.sh "$RUNNER_TEMP/bre-responsabilite.csv"
          grep -q 'CD_NOM' "$RUNNER_TEMP/bre-znieff.csv"
          grep -q 'RESULTAT_EVALUATION' "$RUNNER_TEMP/bre-lrr.csv"
          sha256sum "$RUNNER_TEMP/bre-znieff.csv" "$RUNNER_TEMP/bre-lrr.csv" "$RUNNER_TEMP/bre-responsabilite.csv"
          echo "BRE_ZNIEFF_FILE=$RUNNER_TEMP/bre-znieff.csv" >> "$GITHUB_ENV"
          echo "BRE_LRR_FILE=$RUNNER_TEMP/bre-lrr.csv" >> "$GITHUB_ENV"
          echo "BRE_RESPONSABILITE_FILE=$RUNNER_TEMP/bre-responsabilite.csv" >> "$GITHUB_ENV"

      - name: Build Bretagne regional packages
        run: |
          CHECKED_AT="$(date -u +%F)"
          echo "CHECKED_AT=$CHECKED_AT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/regional" "$RUNNER_TEMP/regional-candidate" "$RUNNER_TEMP/diagnostics"
          python data-pipeline/regions/bre/build_oeb.py \
            --taxref "$TAXREF_FILE" \
            --znieff "$BRE_ZNIEFF_FILE" \
            --lrr "$BRE_LRR_FILE" \
            --responsabilite "$BRE_RESPONSABILITE_FILE" \
            --out-dir "$RUNNER_TEMP/regional" \
            --checked-at "$CHECKED_AT" \
            --min-match-rate 0.97
          node data-pipeline/run-adapter.mjs \
            --source oeb-bretagne-znieff \
            --taxref "$TAXREF_FILE" \
            --input "$BRE_ZNIEFF_FILE" \
            --out "$RUNNER_TEMP/regional-candidate/bre-znieff.json" \
            --diagnostics-out "$RUNNER_TEMP/diagnostics/oeb-bretagne-znieff.json" \
            --checked-at "$CHECKED_AT"
          node data-pipeline/run-adapter.mjs \
            --source oeb-bretagne-lrr \
            --taxref "$TAXREF_FILE" \
            --input "$BRE_LRR_FILE" \
            --out "$RUNNER_TEMP/regional-candidate/bre-lrr.json" \
            --diagnostics-out "$RUNNER_TEMP/diagnostics/oeb-bretagne-lrr.json" \
            --checked-at "$CHECKED_AT"
          echo "BRE_LEGACY_ZNIEFF=$RUNNER_TEMP/regional/bre-znieff.json" >> "$GITHUB_ENV"
          echo "BRE_CANDIDATE_ZNIEFF=$RUNNER_TEMP/regional-candidate/bre-znieff.json" >> "$GITHUB_ENV"
          echo "BRE_ZNIEFF_DIAGNOSTICS=$RUNNER_TEMP/diagnostics/oeb-bretagne-znieff.json" >> "$GITHUB_ENV"
          echo "BRE_LEGACY_LRR=$RUNNER_TEMP/regional/bre-lrr.json" >> "$GITHUB_ENV"
          echo "BRE_CANDIDATE_LRR=$RUNNER_TEMP/regional-candidate/bre-lrr.json" >> "$GITHUB_ENV"
          echo "BRE_LRR_DIAGNOSTICS=$RUNNER_TEMP/diagnostics/oeb-bretagne-lrr.json" >> "$GITHUB_ENV"

      - name: Validate regional package contract
        run: |
          REGIONAL_DIR="$RUNNER_TEMP/regional" node --input-type=module - <<'NODE'
          import { loadRegionalPackages } from './data-pipeline/regional.mjs'
          const packages = await loadRegionalPackages(process.env.REGIONAL_DIR)
          if (packages.length !== 3) throw new Error(`3 paquets Bretagne attendus, reçu ${packages.length}`)
          const ids = new Set(packages.map((pkg) => pkg.source.id))
          if (!ids.has('oeb-bretagne-znieff-csv-2026-01-29')) throw new Error('Paquet ZNIEFF Bretagne absent')
          if (!ids.has('oeb-bretagne-lrr-csv-2026-01-29')) throw new Error('Paquet LRR Bretagne absent')
          if (!ids.has('oeb-bretagne-responsabilite-csv-2026-07-29')) throw new Error('Paquet responsabilité Bretagne absent')
          const byId = Object.fromEntries(packages.map((pkg) => [pkg.source.id, pkg]))
          for (const pkg of packages) {
            if (!pkg.source.sha256 || !/^[a-f0-9]{64}$/.test(pkg.source.sha256)) throw new Error(`SHA-256 absent: ${pkg.source.id}`)
            if (pkg.statuses.length === 0) throw new Error(`Paquet vide: ${pkg.source.id}`)
          }
          const resp = byId['oeb-bretagne-responsabilite-csv-2026-07-29']
          if (resp.source.sha256 !== '38965de26b6c462d5a366b92b9c80bd586b88ff7273603d591367f49c02a7240') {
            throw new Error('SHA-256 responsabilité Bretagne inattendu')
          }
          if (resp.statuses.length < 1_500) throw new Error(`Volume responsabilité anormalement faible: ${resp.statuses.length}`)
          const eryngium = resp.statuses.find((status) => status.cdRef === 97152 && status.value === 'majeure' && status.scope === 'regional')
          if (!eryngium) throw new Error('Sentinelle Eryngium viviparum absente')
          const alca = resp.statuses.filter((status) => status.cdRef === 3388)
          if (!alca.some((status) => status.scope === 'partial' && status.scopeLabel === 'Oiseaux nicheurs' && status.value === 'majeure')) {
            throw new Error('Sentinelle Alca torda nicheurs absente')
          }
          if (!alca.some((status) => status.scope === 'partial' && status.scopeLabel === 'Oiseaux migrateurs' && status.value === 'modérée')) {
            throw new Error('Sentinelle Alca torda migrateurs absente')
          }
          console.log(packages.map((pkg) => ({ id: pkg.source.id, statuses: pkg.statuses.length, diagnostics: pkg.diagnostics })))
          NODE

      - name: Compare ZNIEFF adapter parity
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          const legacy = JSON.parse(await readFile(process.env.BRE_LEGACY_ZNIEFF, 'utf8'))
          const candidate = JSON.parse(await readFile(process.env.BRE_CANDIDATE_ZNIEFF, 'utf8'))
          assert.equal(candidate.schemaVersion, legacy.schemaVersion)
          assert.deepStrictEqual(candidate.source, legacy.source)
          assert.deepStrictEqual(candidate.replaces, legacy.replaces)
          assert.deepStrictEqual(candidate.statuses, legacy.statuses)
          assert.deepStrictEqual(candidate.diagnostics, legacy.diagnostics)
          assert.deepStrictEqual(candidate, legacy)
          console.log(`Parité ZNIEFF : ${candidate.statuses.length} statuts, matchRate=${candidate.diagnostics.matchRate}`)
          NODE

      - name: Validate ZNIEFF diagnostic sidecar
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises'
          const diagnostic = JSON.parse(await readFile(process.env.BRE_ZNIEFF_DIAGNOSTICS, 'utf8'))
          if (diagnostic.schemaVersion !== 1) throw new Error('schemaVersion diagnostic invalide')
          if (diagnostic.sourceId !== 'oeb-bretagne-znieff') throw new Error('sourceId diagnostic inattendu')
          if (diagnostic.packageSourceId !== 'oeb-bretagne-znieff-csv-2026-01-29') throw new Error('packageSourceId inattendu')
          if (diagnostic.quality.status !== 'pass') throw new Error(`quality.status=${diagnostic.quality.status}`)
          const { statusesProduced, resolutionRate, duplicatesDropped, unresolved, ambiguous } = diagnostic.metrics
          console.log({ statusesProduced, resolutionRate, duplicatesDropped, unresolved, ambiguous })
          NODE

      - name: Compare LRR adapter parity
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          const legacy = JSON.parse(await readFile(process.env.BRE_LEGACY_LRR, 'utf8'))
          const candidate = JSON.parse(await readFile(process.env.BRE_CANDIDATE_LRR, 'utf8'))
          assert.equal(candidate.schemaVersion, legacy.schemaVersion)
          assert.deepStrictEqual(candidate.source, legacy.source)
          assert.deepStrictEqual(candidate.replaces, legacy.replaces)
          assert.deepStrictEqual(candidate.statuses, legacy.statuses)
          assert.deepStrictEqual(candidate.diagnostics, legacy.diagnostics)
          assert.deepStrictEqual(candidate, legacy)
          console.log(`Parité LRR : ${candidate.statuses.length} statuts, matchRate=${candidate.diagnostics.matchRate}`)
          NODE

      - name: Validate LRR diagnostic sidecar
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises'
          const diagnostic = JSON.parse(await readFile(process.env.BRE_LRR_DIAGNOSTICS, 'utf8'))
          if (diagnostic.schemaVersion !== 1) throw new Error('schemaVersion diagnostic invalide')
          if (diagnostic.sourceId !== 'oeb-bretagne-lrr') throw new Error('sourceId diagnostic inattendu')
          if (diagnostic.packageSourceId !== 'oeb-bretagne-lrr-csv-2026-01-29') throw new Error('packageSourceId inattendu')
          if (diagnostic.quality.status !== 'pass') throw new Error(`quality.status=${diagnostic.quality.status}`)
          const { statusesProduced, resolutionRate, duplicatesDropped, categories } = diagnostic.metrics
          if (statusesProduced !== 2187) throw new Error(`statusesProduced=${statusesProduced}`)
          if (resolutionRate !== 1) throw new Error(`resolutionRate=${resolutionRate}`)
          if (duplicatesDropped !== 25) throw new Error(`duplicatesDropped=${duplicatesDropped}`)
          if (categories.red_list_regional !== 2187) throw new Error(`categories.red_list_regional=${categories.red_list_regional}`)
          const sentinel = diagnostic.quality.checks.find((check) => check.id === 'sentinel:97152')
          if (!sentinel?.passed) throw new Error('sentinelle 97152 absente ou échouée')
          console.log({ statusesProduced, resolutionRate, duplicatesDropped, categories, sentinel })
          NODE

      - name: Upload normalized packages
        uses: actions/upload-artifact@v4
        with:
          name: bre-regional-packages
          path: ${{ runner.temp }}/regional/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload ZNIEFF diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bre-znieff-diagnostics
          path: ${{ runner.temp }}/diagnostics/oeb-bretagne-znieff.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload LRR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bre-lrr-diagnostics
          path: ${{ runner.temp }}/diagnostics/oeb-bretagne-lrr.json
          if-no-files-found: warn
          retention-days: 7
