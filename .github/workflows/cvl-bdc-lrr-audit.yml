name: CVL BDC regional red-list audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cvl-bdc-lrr-audit.yml'

jobs:
  audit-cvl-bdc-lrr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download BDC Statuts v18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bdc"
          curl --fail --location --retry 3 https://assets.patrinat.fr/files/referentiel/BDC.zip -o "$RUNNER_TEMP/bdc.zip" \
            || curl --fail --location --retry 3 https://geonature.fr/data/inpn/taxonomie/BDC-STATUTS-v18.zip -o "$RUNNER_TEMP/bdc.zip"
          unzip -q "$RUNNER_TEMP/bdc.zip" -d "$RUNNER_TEMP/bdc"
          BDC_FILE=''
          while IFS= read -r candidate; do
            header="$(head -n 1 "$candidate" | tr '[:upper:]' '[:lower:]')"
            if grep -q 'cd_ref' <<< "$header" && grep -q 'cd_type_statut' <<< "$header"; then
              BDC_FILE="$candidate"
              break
            fi
          done < <(find "$RUNNER_TEMP/bdc" -type f -iname '*.csv')
          test -n "$BDC_FILE"
          echo "BDC_FILE=$BDC_FILE" >> "$GITHUB_ENV"

      - name: Identify CVL LRR documents and taxonomic coverage
        shell: bash
        run: |
          BDC_FILE="$BDC_FILE" node --input-type=module - <<'NODE'
          import { rowsFromFile, statusCategory } from './data-pipeline/pipeline.mjs'
          import { REGIONS, resolveScope } from './data-pipeline/regions.mjs'

          const region = REGIONS.find((item) => item.code === 'CVL')
          const docs = new Map()
          let total = 0

          for await (const row of rowsFromFile(process.env.BDC_FILE)) {
            if (statusCategory(row.cd_type_statut) !== 'red_list_regional') continue
            const scope = resolveScope(row.cd_sig, region)
            if (!scope) continue
            total += 1
            const doc = row.cd_doc || '<sans-cd-doc>'
            const current = docs.get(doc) ?? {
              cdDoc: doc,
              cdSig: row.cd_sig,
              scope: scope.scope,
              scopeLabel: scope.scopeLabel ?? null,
              fullCitation: row.full_citation || null,
              docUrl: row.doc_url || null,
              count: 0,
              statusCodes: new Set(),
              group1: new Map(),
              group2: new Map(),
              orders: new Map(),
              families: new Map(),
              examples: [],
            }
            current.count += 1
            if (!current.fullCitation && row.full_citation) current.fullCitation = row.full_citation
            if (!current.docUrl && row.doc_url) current.docUrl = row.doc_url
            if (row.code_statut) current.statusCodes.add(row.code_statut)
            for (const [map, value] of [
              [current.group1, row.group1_inpn],
              [current.group2, row.group2_inpn],
              [current.orders, row.ordre],
              [current.families, row.famille],
            ]) {
              if (!value) continue
              map.set(value, (map.get(value) ?? 0) + 1)
            }
            if (current.examples.length < 5) {
              current.examples.push({
                cdRef: row.cd_ref,
                scientificName: row.lb_nom,
                group1: row.group1_inpn,
                group2: row.group2_inpn,
                order: row.ordre,
                codeStatut: row.code_statut,
              })
            }
            docs.set(doc, current)
          }

          const top = (map, max = 12) => [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, max)
          const report = [...docs.values()]
            .map((item) => ({
              cdDoc: item.cdDoc,
              count: item.count,
              cdSig: item.cdSig,
              scope: item.scope,
              scopeLabel: item.scopeLabel,
              fullCitation: item.fullCitation,
              docUrl: item.docUrl,
              statusCodes: [...item.statusCodes].sort(),
              group1: top(item.group1),
              group2: top(item.group2),
              orders: top(item.orders),
              families: top(item.families),
              examples: item.examples,
            }))
            .sort((a, b) => b.count - a.count || String(a.cdDoc).localeCompare(String(b.cdDoc)))

          console.log('CVL_LRR_ROWS=', total)
          console.log(JSON.stringify(report, null, 2))
          if (!total) throw new Error('Aucune LRR BDC applicable à CVL')
          NODE
