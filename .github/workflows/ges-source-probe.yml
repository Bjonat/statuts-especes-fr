name: Grand Est ZNIEFF source delivery probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ges-source-probe.yml'

jobs:
  probe-ges-znieff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook inspector
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Inspect current ODONAT Grand Est workbook
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.odonat-grandest.fr/wp-content/uploads/2026/08/listes_especes-determinantes-znieff_grand-est_juin2026.xlsx'
          curl --fail --location --retry 3 --max-time 120 "$url" -o "$RUNNER_TEMP/ges-current.xlsx"
          test "$(head -c 2 "$RUNNER_TEMP/ges-current.xlsx")" = 'PK'
          sha256sum "$RUNNER_TEMP/ges-current.xlsx"
          ls -lh "$RUNNER_TEMP/ges-current.xlsx"
          XLSX="$RUNNER_TEMP/ges-current.xlsx" python - <<'PY'
          import os
          from openpyxl import load_workbook

          path = os.environ['XLSX']
          wb = load_workbook(path, read_only=True, data_only=True)
          print('SHEETS=', wb.sheetnames)
          for ws in wb.worksheets:
              print(f'===== SHEET {ws.title} rows={ws.max_row} cols={ws.max_column} =====')
              shown = 0
              for row in ws.iter_rows(min_row=1, max_row=min(ws.max_row, 45), values_only=True):
                  values = [str(v).strip() if v is not None else '' for v in row[:45]]
                  if not any(values):
                      continue
                  print(values)
                  shown += 1
                  if shown >= 16:
                      break
          PY

      - name: Confirm source link through WordPress API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url='https://www.odonat-grandest.fr/wp-json/wp/v2/media/11584'
          req=urllib.request.Request(url,headers={'User-Agent':'statuts-especes-fr/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:
              row=json.load(r)
          print(json.dumps({k: row.get(k) for k in ('id','date','modified','slug','mime_type','source_url')}, ensure_ascii=False, indent=2))
          assert row.get('source_url') == 'https://www.odonat-grandest.fr/wp-content/uploads/2026/08/listes_especes-determinantes-znieff_grand-est_juin2026.xlsx'
          PY
