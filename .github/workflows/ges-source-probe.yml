name: Grand Est ZNIEFF source delivery probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ges-source-probe.yml'

jobs:
  probe-ges-znieff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect ODONAT and CBAL media sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          UA = 'Mozilla/5.0 (compatible; statuts-especes-fr/1.0; +https://github.com/Bjonat/statuts-especes-fr)'

          def get(url, timeout=60):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json,text/html,*/*'})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read(), dict(response.headers), response.status

          def wp_media(base, terms):
              print(f'===== WORDPRESS {base} =====')
              for term in terms:
                  url = f'{base}/wp-json/wp/v2/media?' + urllib.parse.urlencode({'search': term, 'per_page': 100})
                  try:
                      data, headers, status = get(url)
                      print('QUERY', term, 'status=', status, 'bytes=', len(data), 'content-type=', headers.get('Content-Type'))
                      rows = json.loads(data.decode('utf-8'))
                      print('COUNT=', len(rows))
                      for row in rows:
                          source = row.get('source_url') or ''
                          title = (row.get('title') or {}).get('rendered') or ''
                          slug = row.get('slug') or ''
                          mime = row.get('mime_type') or ''
                          if any(token in (source + ' ' + title + ' ' + slug).casefold() for token in ('znieff','determin','faune','flore','catalog','statut')):
                              print(json.dumps({'id':row.get('id'),'date':row.get('date'),'slug':slug,'title':title,'mime':mime,'source_url':source}, ensure_ascii=False))
                  except Exception as exc:
                      print('ERROR', term, repr(exc))

          wp_media('https://www.odonat-grandest.fr', ['znieff','determinante','faune','edz'])
          wp_media('https://www.cbnal.fr', ['znieff','catalogue','tracheophytes','grand est','statut'])

          print('===== ODONAT OLD XLSX WAYBACK =====')
          old = 'https://www.odonat-grandest.fr/wp-content/uploads/2024/09/odonatge_znieff_listes_edz_aee_faunev2_1_08_2024.xlsx'
          cdx = 'https://web.archive.org/cdx/search/cdx?' + urllib.parse.urlencode({
              'url': old,
              'output': 'json',
              'filter': 'statuscode:200',
              'fl': 'timestamp,original,statuscode,mimetype,digest,length',
              'collapse': 'digest',
          })
          try:
              data, _, _ = get(cdx, timeout=90)
              rows = json.loads(data.decode('utf-8'))
              print(json.dumps(rows, ensure_ascii=False, indent=2))
          except Exception as exc:
              print('WAYBACK ERROR', repr(exc))

          print('===== ODONAT PAGE LINKS =====')
          page_url = 'https://www.odonat-grandest.fr/znieff-documents-telechargeables/'
          try:
              data, _, status = get(page_url)
              text = data.decode('utf-8', 'replace')
              print('PAGE status=', status, 'bytes=', len(data))
              for token in text.split('href=')[1:]:
                  quote = token[:1]
                  if quote not in ('"', "'"):
                      continue
                  href = token[1:].split(quote,1)[0]
                  if any(x in href.casefold() for x in ('xlsx','xls','znieff','determin')):
                      print('HREF', href)
          except Exception as exc:
              print('PAGE ERROR', repr(exc))
          PY
