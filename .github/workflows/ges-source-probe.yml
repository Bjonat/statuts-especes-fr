name: Grand Est ZNIEFF source delivery probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ges-source-probe.yml'

jobs:
  probe-ges-znieff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect ODONAT and CBAL media sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          UA = 'Mozilla/5.0 (compatible; statuts-especes-fr/1.0; +https://github.com/Bjonat/statuts-especes-fr)'

          def get(url, timeout=10):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json,text/html,*/*'})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read(), dict(response.headers), response.status

          queries = [
              ('ODONAT-znieff', 'https://www.odonat-grandest.fr/wp-json/wp/v2/media?search=znieff&per_page=100'),
              ('ODONAT-edz', 'https://www.odonat-grandest.fr/wp-json/wp/v2/media?search=edz&per_page=100'),
              ('CBAL-znieff', 'https://www.cbnal.fr/wp-json/wp/v2/media?search=znieff&per_page=100'),
              ('CBAL-catalogue', 'https://www.cbnal.fr/wp-json/wp/v2/media?search=catalogue&per_page=100'),
          ]
          for label, url in queries:
              print('=====', label, '=====')
              try:
                  data, headers, status = get(url)
                  print('status=', status, 'bytes=', len(data), 'content-type=', headers.get('Content-Type'))
                  rows = json.loads(data.decode('utf-8'))
                  print('COUNT=', len(rows))
                  for row in rows:
                      print(json.dumps({
                          'id': row.get('id'),
                          'date': row.get('date'),
                          'slug': row.get('slug'),
                          'title': (row.get('title') or {}).get('rendered'),
                          'mime': row.get('mime_type'),
                          'source_url': row.get('source_url'),
                      }, ensure_ascii=False))
              except Exception as exc:
                  print('ERROR', repr(exc))

          print('===== ODONAT CURRENT PAGE LINK =====')
          try:
              data, _, status = get('https://www.odonat-grandest.fr/znieff-documents-telechargeables/')
              text = data.decode('utf-8', 'replace')
              print('status=', status, 'bytes=', len(data))
              for token in text.split('href=')[1:]:
                  q = token[:1]
                  if q not in ('"', "'"):
                      continue
                  href = token[1:].split(q, 1)[0]
                  if any(x in href.casefold() for x in ('xlsx','xls','znieff','determin')):
                      print('HREF', href)
          except Exception as exc:
              print('ERROR', repr(exc))
          PY
