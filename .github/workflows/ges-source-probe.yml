name: Grand Est ZNIEFF source delivery probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ges-source-probe.yml'

jobs:
  probe-ges-znieff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook inspector
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Probe official and focused archive deliveries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import hashlib
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from openpyxl import load_workbook

          UA = 'Mozilla/5.0 (compatible; statuts-especes-fr/1.0; +https://github.com/Bjonat/statuts-especes-fr)'
          sources = {
              'fauna': {
                  'url': 'https://www.grand-est.developpement-durable.gouv.fr/IMG/xlsx/listes_edz_aee_faunev2_2_juin2026.xlsx',
                  'collections': ['CC-MAIN-2026-30'],
              },
              'flora': {
                  'url': 'https://www.grand-est.developpement-durable.gouv.fr/IMG/xlsx/listes_edz_aee_florev1_08_2024_2_.xlsx',
                  'collections': ['CC-MAIN-2026-30', 'CC-MAIN-2025-05', 'CC-MAIN-2024-51', 'CC-MAIN-2024-46', 'CC-MAIN-2024-42', 'CC-MAIN-2024-38'],
              },
          }

          def get(url: str, timeout=35, headers=None) -> bytes:
              request_headers = {'User-Agent': UA, 'Accept': '*/*'}
              if headers:
                  request_headers.update(headers)
              req = urllib.request.Request(url, headers=request_headers)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          def is_xlsx(data: bytes) -> bool:
              return data.startswith(b'PK\x03\x04') and b'[Content_Types].xml' in data[:1000000]

          def commoncrawl_records(collection: str, url: str):
              index_url = f'https://index.commoncrawl.org/{collection}-index'
              query = index_url + '?' + urllib.parse.urlencode({'url': url, 'output': 'json'})
              try:
                  text = get(query, timeout=35).decode('utf-8', 'replace')
              except Exception as exc:
                  return [], repr(exc)
              records = []
              for line in text.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      records.append(json.loads(line))
                  except json.JSONDecodeError:
                      pass
              return records, None

          def commoncrawl_body(record: dict) -> bytes:
              offset = int(record['offset'])
              length = int(record['length'])
              warc_url = 'https://data.commoncrawl.org/' + record['filename']
              compressed = get(
                  warc_url,
                  timeout=90,
                  headers={'Range': f'bytes={offset}-{offset + length - 1}'},
              )
              raw = gzip.decompress(compressed)
              first = raw.find(b'\r\n\r\n')
              if first < 0:
                  raise RuntimeError('En-tête WARC introuvable')
              http = raw[first + 4:]
              second = http.find(b'\r\n\r\n')
              if second < 0:
                  raise RuntimeError('En-tête HTTP introuvable')
              headers = http[:second].decode('latin1', 'replace').lower()
              body = http[second + 4:]
              if 'content-encoding: gzip' in headers:
                  body = gzip.decompress(body)
              return body

          def inspect(path: Path):
              wb = load_workbook(path, read_only=True, data_only=True)
              print('SHEETS=', wb.sheetnames)
              for ws in wb.worksheets[:12]:
                  print(f'--- SHEET {ws.title} rows={ws.max_row} cols={ws.max_column} ---')
                  shown = 0
                  for row in ws.iter_rows(min_row=1, max_row=min(ws.max_row, 28), values_only=True):
                      values = [str(v).strip() if v is not None else '' for v in row[:32]]
                      if any(values):
                          print(values)
                          shown += 1
                      if shown >= 10:
                          break

          for key, spec in sources.items():
              official_url = spec['url']
              print(f'===== {key.upper()} =====')
              selected = None
              try:
                  data = get(official_url)
                  print('DIRECT bytes=', len(data), 'sha256=', hashlib.sha256(data).hexdigest(), 'xlsx=', is_xlsx(data), 'head=', data[:80])
                  if is_xlsx(data):
                      selected = ('direct', official_url, data)
              except Exception as exc:
                  print('DIRECT ERROR', repr(exc))

              if selected is None:
                  for collection in spec['collections']:
                      records, error = commoncrawl_records(collection, official_url)
                      if error:
                          print('CC INDEX ERROR', collection, error)
                          continue
                      matches = [r for r in records if str(r.get('status')) == '200']
                      print('CC MATCHES', collection, len(matches))
                      for record in reversed(matches):
                          print('CC RECORD', collection, {k: record.get(k) for k in ('timestamp','status','mime','digest','length','filename','offset')})
                          try:
                              data = commoncrawl_body(record)
                          except Exception as exc:
                              print('CC BODY ERROR', collection, record.get('timestamp'), repr(exc))
                              continue
                          print('COMMONCRAWL', collection, record.get('timestamp'), 'bytes=', len(data), 'sha256=', hashlib.sha256(data).hexdigest(), 'xlsx=', is_xlsx(data))
                          if is_xlsx(data):
                              selected = (f"commoncrawl:{collection}:{record.get('timestamp')}", official_url, data)
                              break
                      if selected is not None:
                          break

              if selected is None:
                  print('NO VALID XLSX DELIVERY FOUND')
                  continue

              mode, selected_url, data = selected
              path = Path(f'/tmp/ges-{key}.xlsx')
              path.write_bytes(data)
              print('SELECTED_MODE=', mode)
              print('SELECTED_URL=', selected_url)
              print('SELECTED_BYTES=', len(data))
              print('SELECTED_SHA256=', hashlib.sha256(data).hexdigest())
              inspect(path)
          PY
