name: Hauts-de-France LRR smoke test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'data-pipeline/regions/hdf/**'
      - 'data-pipeline/regional.mjs'
      - '.github/workflows/hdf-lrr-smoke.yml'

jobs:
  build-hdf-lrr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XLSX reader
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Download TAXREF v18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/taxref"
          curl --fail --location --retry 3 https://assets.patrinat.fr/files/referentiel/TAXREF_v18_2025.zip -o "$RUNNER_TEMP/taxref.zip" \
            || curl --fail --location --retry 3 https://geonature.fr/data/inpn/taxonomie/TAXREF_v18_2025.zip -o "$RUNNER_TEMP/taxref.zip"
          unzip -q "$RUNNER_TEMP/taxref.zip" -d "$RUNNER_TEMP/taxref"
          TAXREF_FILE="$(find "$RUNNER_TEMP/taxref" -type f -iname 'TAXREFv18.txt' | head -n 1)"
          test -n "$TAXREF_FILE"
          echo "TAXREF_FILE=$TAXREF_FILE" >> "$GITHUB_ENV"

      - name: Download Hauts-de-France LRR sources
        shell: bash
        run: |
          set -euo pipefail
          bash data-pipeline/regions/hdf/download_lrr.sh "$RUNNER_TEMP/hdf-lrr"
          echo "HDF_LRR_DIR=$RUNNER_TEMP/hdf-lrr" >> "$GITHUB_ENV"

      - name: Build Hauts-de-France LRR packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hdf-lrr-packages"
          python data-pipeline/regions/hdf/build_lrr.py \
            --taxref "$TAXREF_FILE" \
            --input-dir "$HDF_LRR_DIR" \
            --out-dir "$RUNNER_TEMP/hdf-lrr-packages" \
            --checked-at 2026-08-26 \
            --min-match-rate 0.97
          echo "HDF_LRR_PACKAGES_DIR=$RUNNER_TEMP/hdf-lrr-packages" >> "$GITHUB_ENV"

      - name: Validate regional packages and sentinels
        shell: bash
        run: |
          REGIONAL_DIR="$HDF_LRR_PACKAGES_DIR" node --input-type=module - <<'NODE'
          import { loadRegionalPackages } from './data-pipeline/regional.mjs'
          const packages = await loadRegionalPackages(process.env.REGIONAL_DIR)
          if (packages.length !== 6) throw new Error(`6 paquets HDF LRR attendus, reçu ${packages.length}`)
          const byId = Object.fromEntries(packages.map((pkg) => [pkg.source.id, pkg]))
          const required = [
            'irpn-hdf-lrr-oiseaux-nicheurs-2024',
            'irpn-hdf-lrr-papillons-jour-2024',
            'irpn-hdf-lrr-mollusques-2024',
            'irpn-hdf-lrr-poissons-ecrevisses-2025',
            'irpn-hdf-lrr-orthopteres-2025',
            'irpn-hdf-lrr-coccinelles-2025',
          ]
          for (const id of required) {
            const pkg = byId[id]
            if (!pkg) throw new Error(`Source absente: ${id}`)
            if (!pkg.source.sha256 || !/^[a-f0-9]{64}$/.test(pkg.source.sha256)) throw new Error(`SHA-256 absent: ${id}`)
            if ('url' in pkg.source) throw new Error(`Champ url interdit: ${id}`)
            const rule = pkg.replaces[0]
            if (!rule || rule.region !== 'HDF' || rule.category !== 'red_list_regional' || rule.realm !== 'fauna' || !Array.isArray(rule.cdRefs) || !rule.cdRefs.length) {
              throw new Error(`Override invalide: ${id}`)
            }
            if ((pkg.diagnostics?.matchRate ?? 0) < 0.97) throw new Error(`Raccord insuffisant: ${id}`)
          }
          const statuses = packages.reduce((sum, pkg) => sum + pkg.statuses.length, 0)
          if (statuses < 500) throw new Error(`Volume HDF LRR anormalement faible: ${statuses}`)

          const oiseaux = byId['irpn-hdf-lrr-oiseaux-nicheurs-2024'].statuses.find((s) => s.cdRef === 4127 && s.value === 'RE' && s.category === 'red_list_regional')
          if (!oiseaux) throw new Error('Sentinelle Turdus pilaris absente')
          const papillons = byId['irpn-hdf-lrr-papillons-jour-2024'].statuses.find((s) => s.cdRef === 53425 && s.value === 'RE' && s.category === 'red_list_regional')
          if (!papillons) throw new Error('Sentinelle Chazara briseis absente')
          console.log({ packages: packages.length, statuses })
          NODE

      - name: Upload normalized packages
        uses: actions/upload-artifact@v4
        with:
          name: hdf-lrr-regional-packages
          path: ${{ env.HDF_LRR_PACKAGES_DIR }}/*.json
          if-no-files-found: error
          retention-days: 7
